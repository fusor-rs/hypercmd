[package]
name = "hypercmd-landing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor = { package = "fusor-core", version = "=0.1.4", features = ["dom", "derive"] }
fusor-components = { version = "=0.1.4", features = ["browser"] }
hypercmd = { path = "../../crates/hypercmd", default-features = false }
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"
web-sys = { version = "=0.3.94", features = ["Window", "Navigator", "Clipboard", "HtmlInputElement"] }

[build-dependencies]
docs-base-build = { git = "https://github.com/fusor-rs/docs-base", rev = "e2c7b3939721002ea2aa7556d8e4409aa131472b" }
fusor-build = "=0.1.4"
hypercmd-build = { path = "../../crates/hypercmd-build" }
quote = "=1.0.47"

[package.metadata.fusor]
entry = "web/index.html"
templates = []
assets = "public"
base-path = "/"

[package.metadata.hypercmd]
templates = ["ui"]
styles = ["ui/terminal.css"]

[lints.rust]
unsafe_code = "forbid"
