<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Build terminal applications with HTML and Rust. Hypercmd guides and reference." />
    <title>hypercmd documentation</title>
    <link rel="icon" href="/docs/favicon.svg" />
    <link rel="stylesheet" href="/docs/docs-base.css" />
    <link rel="stylesheet" href="/docs/brand.css" />
  </head>
  <body>
    <App state="{{ App::new() }}">
      <div class="docs-app">
        <Shell navigation="{{ state.navigation.clone() }}" header="{{ Some(state.header.clone()) }}" sidebar="{{ None }}">
          <Router><Route fallback>
            <DocRoute navigation="{{ state.navigation.clone() }}"></DocRoute>
          </Route></Router>
        </Shell>
      </div>
    </App>
  </body>
</html>

<template rust:component="Header">
  <div>
    <a href="/">Home</a>
    <a href="https://github.com/fusor-rs/hypercmd">GitHub ↗</a>
    <a href="https://fusor.build/docs/">Fusor ↗</a>
  </div>
</template>
<template rust:component="DocRoute">
  <div class="doc-route">
    <Article site="{{ &SITE }}" index="{{ state.index }}" extras="{{ ArticleExtras::default() }}"></Article>
  </div>
</template>
