[package]
name = "hypercmd-docs"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
docs-base = { git = "https://github.com/fusor-rs/docs-base", rev = "78990c2b07d510abc76224e82ca933f89f423850" }
fusor = { package = "fusor-core", version = "=0.1.5", features = ["dom", "derive"] }
fusor-components = { version = "=0.1.5", features = ["browser"] }
fusor-router = { version = "=0.1.5", features = ["browser"] }
wasm-bindgen = "=0.2.117"

[build-dependencies]
docs-base-build = { git = "https://github.com/fusor-rs/docs-base", rev = "78990c2b07d510abc76224e82ca933f89f423850" }
fusor-build = "=0.1.5"

[package.metadata.fusor]
entry = "web/index.html"
assets = "public"
base-path = "/docs/"
history-fallback = ["/"]

[lints.rust]
unsafe_code = "forbid"
