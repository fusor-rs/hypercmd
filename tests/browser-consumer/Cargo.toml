[package]
name = "hypercmd-browser-consumer"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hypercmd-job-controls = { path = "../../examples/job-controls", features = ["terminal", "browser"] }
fusor = { package = "fusor-core", version = "=0.1.4", default-features = false, features = ["dom"] }
fusor-components = { version = "=0.1.4", default-features = false, features = ["browser"] }
wasm-bindgen = "=0.2.117"
web-sys = { version = "=0.3.94", features = ["Window", "Document", "Element", "HtmlHeadElement"] }

[build-dependencies]
fusor-build = { version = "=0.1.4" }

[package.metadata.fusor]
entry = "web/index.html"
templates = []
output = "dist"
base-path = "/"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
