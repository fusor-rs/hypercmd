[package]
name = "hypercmd-consumer"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[package.metadata.hypercmd]
entry = "ui/app.html"
templates = ["ui"]
styles = ["ui/terminal.css"]

[dependencies]
hypercmd = { path = "../../crates/hypercmd", default-features = false }
fusor = { package = "fusor-core", version = "=0.1.4", default-features = false, features = ["derive"] }
fusor-components = { version = "=0.1.4", default-features = false }
fusor-router = { version = "=0.1.4", default-features = false }
fusor-async = { version = "=0.1.4", default-features = false }

fusor-std = { version = "=0.1.4", default-features = false, features = ["forms"] }

[dev-dependencies]
fusor-test = { version = "=0.1.4", default-features = false }

[build-dependencies]
hypercmd-build = { path = "../../crates/hypercmd-build" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
